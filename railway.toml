# Railway config at repo root (MaksonPharmaHRMS/railway.toml)
# Settings → Config-as-code path: /railway.toml
# Leave Root Directory EMPTY so this Dockerfile is visible.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
