# Railway config at repo root (MaksonPharmaHRMS/railway.toml)
# Settings → Config-as-code path: /railway.toml
# IMPORTANT: Root Directory must be EMPTY (repo root). Do not set it to mams/.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["mams/**"]

[deploy]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
