# Netlify — MAMS web app (SPA) only.
# API (mams-server) runs on Railway; MongoDB on Atlas.

[build]
  base = "mams"
  command = "npm install && npm run build --workspace @mams/types && npm run build --workspace mams-web"
  publish = "mams-web/dist"

[build.environment]
  # Call Railway directly until Netlify /api proxy is confirmed off Render.
  # Leave empty later to use same-origin /api proxy again.
  VITE_API_BASE_URL = "https://maksonpharmahrms-copy-production.up.railway.app"
  VITE_DEVICE_API_BASE_URL = "https://maksonpharmahrms-copy-production.up.railway.app"

[[redirects]]
  from = "/api/*"
  to = "https://maksonpharmahrms-copy-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
