# Netlify — MAMS web app (SPA) only.
# API (mams-server) runs on Render; MongoDB on Atlas.

[build]
  base = "mams"
  command = "npm install && npm run build --workspace @mams/types && npm run build --workspace mams-web"
  publish = "mams-web/dist"

[build.environment]
  # Force same-origin /api even if set in Netlify UI (see mams-web/src/api/apiBase.ts).
  VITE_API_BASE_URL = ""

# Leave VITE_API_BASE_URL unset — browser calls same-origin /api; Netlify proxies to Render (see [[redirects]] below).
# Do not set VITE_API_BASE_URL in Netlify UI either, or the SPA will call Render directly and require CORS.

[[redirects]]
  from = "/api/*"
  to = "https://mams-api-xvso.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
