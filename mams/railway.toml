# Railway — MAMS API (Docker). Path from repo root: /mams/railway.toml
# In Railway Settings → Config-as-code, set file path to: /mams/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Do not set buildCommand / startCommand — Dockerfile ENTRYPOINT handles it.
