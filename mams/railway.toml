# Prefer repo-root /railway.toml + /Dockerfile for Railway.
# If Root Directory is set to mams, use this file and dockerfilePath below.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Do not set buildCommand / startCommand — Dockerfile ENTRYPOINT handles it.
