# ==============================================================================
# MAMS On-Prem Nginx Configuration: SPA + Reverse Proxy
# ==============================================================================

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ----------------------------------------------------------------------------
  # Performance: Gzip Compression
  # ----------------------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # ----------------------------------------------------------------------------
  # Security Headers
  # ----------------------------------------------------------------------------
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Allow larger payloads for bug report attachments / audio / images
  client_max_body_size 25m;

  # ----------------------------------------------------------------------------
  # Static Asset Caching (Vite hashed bundles under /assets/)
  # ----------------------------------------------------------------------------
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ----------------------------------------------------------------------------
  # REST API Reverse Proxy
  # ----------------------------------------------------------------------------
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
  }

  # ----------------------------------------------------------------------------
  # eSSL ADMS Biometric Device Push Proxy (Port 8089 -> :80 -> :3001)
  # ----------------------------------------------------------------------------
  location /iclock {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # ----------------------------------------------------------------------------
  # Hanvon Biometric Push Proxy
  # ----------------------------------------------------------------------------
  location /integrations/hanvon {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # ----------------------------------------------------------------------------
  # SPA Routing Fallback (Never cache index.html)
  # ----------------------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
