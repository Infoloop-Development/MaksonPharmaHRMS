# Render — MAMS API (mams-server) with Docker (Node + Python Vosk + ffmpeg)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mams-api
    runtime: docker
    rootDir: mams
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: info
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: SMART_ANCHOR_VERSION
        value: v2.0.0
      - key: FEATURE_UNMASK_ENABLED
        value: "true"
      - key: COMPLIANCE_AUTOGEN_ENABLED
        value: "false"
      - key: REPORT_JOBS_ENABLED
        value: "true"
      - key: MAIL_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: "https://maksonhrms.netlify.app"
      - key: PUBLIC_APP_URL
        value: "https://maksonhrms.netlify.app"
      - key: BUG_REPORT_MEDIA_DIR
        value: /var/data/bug-reports
      - key: BUG_REPORT_TRANSCRIPTION_TEMP_DIR
        value: /tmp/mams-transcription
      - key: VOSK_SERVICE_URL
        value: http://127.0.0.1:8765
      - key: VOSK_MODELS_DIR
        value: /app/mams/mams-server/vosk-models
      # Set these in the Render dashboard (secrets):
      # MONGO_URI, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
